name: fetch-flows

on:
  workflow_dispatch:
  schedule:
    # 15:50 KST (06:50 UTC) - KRX regular-session data (~15:35)
    - cron: "50 6 * * 1-5"
    # 18:10 KST (09:10 UTC) - mid-evening refresh
    - cron: "10 9 * * 1-5"
    # 20:40 KST (11:40 UTC) - final incl. NXT (~20:05)
    - cron: "40 11 * * 1-5"
    # 22:30 KST (13:30 UTC) - retry
    - cron: "30 13 * * 1-5"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install pandas lxml requests
          pip install git+https://github.com/beaten-by-the-market/krx-data-api.git

      - name: Fetch flows (Naver)
        run: python fetch_flows.py
        continue-on-error: true

      - name: Fetch KRX (login)
        run: python krx_fetch.py
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}

      - name: Show status
        run: |
          cat data/status.txt || true
          cat data/krx/status.txt || true

      - name: Commit data
        run: |
          git config user.name "flow-bot"
          git config user.email "flow-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: flows $(TZ=Asia/Seoul date +%F_%H%M)"
          git push
