name: fetch-flows

on:
  workflow_dispatch:
    inputs:
      reset_login:
        description: "KRX 비밀번호(KRX_PW)를 고친 뒤 체크: 로그인 차단 해제"
        type: boolean
        default: false
  schedule:
    # Every 20 minutes, all day (KST = UTC+9). gate.py decides what to do:
    # KRX regular-session data once after ~15:45 (prelim), final once after 20:20,
    # then later runs stop without touching KRX.
    - cron: "7,27,47 * * * *"

concurrency:
  group: fetch-flows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gate (what is still missing?)
        id: gate
        run: python gate.py
        env:
          RESET_LOGIN: ${{ inputs.reset_login }}

      - name: Install deps
        if: steps.gate.outputs.any == 'true'
        run: |
          pip install pandas lxml requests
          pip install git+https://github.com/beaten-by-the-market/krx-data-api.git

      - name: Fetch flows (Naver)
        if: steps.gate.outputs.run_naver == 'true'
        run: |
          python fetch_flows.py || true
          python gate.py mark-naver ${{ steps.gate.outputs.target }}
        timeout-minutes: 6

      - name: Fetch KRX (login)
        if: steps.gate.outputs.run_krx == 'true'
        run: python krx_fetch.py
        continue-on-error: true
        timeout-minutes: 10
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TARGET_DAY: ${{ steps.gate.outputs.target }}
          KRX_PHASE: ${{ steps.gate.outputs.krx_phase }}

      - name: Show status
        if: steps.gate.outputs.any == 'true'
        run: |
          cat data/status.txt || true
          cat data/krx/status.txt || true
          cat data/krx/state.json || true

      - name: Commit data
        if: steps.gate.outputs.any == 'true'
        run: |
          git config user.name "flow-bot"
          git config user.email "flow-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: flows $(TZ=Asia/Seoul date +%F_%H%M)"
          git pull --rebase origin main
          git push
